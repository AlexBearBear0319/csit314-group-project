<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Story #39: BCE"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#4f5a45"/></marker></defs><rect width="100%" height="100%" fill="#f7f5f0"/><style>text{font-family:Arial,sans-serif;fill:#262522;font-size:16px}.title{font-size:24px;font-weight:bold}.box{fill:white;stroke:#4f5a45;stroke-width:2}.line{fill:none;stroke:#4f5a45;stroke-width:2;marker-end:url(#arrow)}</style><text class="title" x="30" y="40">Story #39: BCE</text><rect x="30" y="110" width="340" height="210" class="box"/><text x="45" y="145" style="font-size:16px">«boundary»</text><text x="45" y="177" style="font-size:20px">CreateIDPCategoryPg</text><path d="M30,195 H370" stroke="#4f5a45"/><text x="45" y="228" style="font-size:14px">React function component</text><rect x="430" y="110" width="340" height="210" class="box"/><text x="445" y="145" style="font-size:16px">«control»</text><text x="445" y="177" style="font-size:20px">CreateIDPCategoryC</text><path d="M430,195 H770" stroke="#4f5a45"/><text x="445" y="228" style="font-size:14px">createCategory(body)</text><rect x="830" y="110" width="340" height="210" class="box"/><text x="845" y="145" style="font-size:16px">«entity»</text><text x="845" y="177" style="font-size:20px">IDPCategory</text><path d="M830,195 H1170" stroke="#4f5a45"/><text x="845" y="228" style="font-size:14px">createCategory(name, description)</text><path d="M370,210 H430" class="line"/><path d="M770,210 H830" class="line"/><text x="30" y="365" style="font-size:16px">Boundary → API adapter → router + session / role / CSRF checks → controller → entity.</text><text x="30" y="400" style="font-size:16px">Only the entity uses Sequelize. React boundaries are functions, not JavaScript classes.</text></svg>